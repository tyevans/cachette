[package]
name = "cachette-core"
description = "The Cachette simulation core. This crate must never depend on PyO3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ADR-0041: this crate has no PyO3 dependency at all. The check in
# scripts/check-crate-split.sh fails if one appears in the tree.
[dependencies]
bytemuck.workspace = true

# `probe-nondeterminism` is a test-only switch. It makes every slot reduction
# read its slots in reverse index order, so any result that depends on slot
# order changes. That covers the event log join and every minimum, maximum
# and first-wins. The probe tests then assert that the determinism tests
# fail. A determinism test with no proven failure mode is decoration.
#
# `stage-cost` is a measurement switch. It names every stage of a frame and
# records what each one costs, so that a cost belongs to a stage rather than
# to the frame. It reads a clock and writes two integers to a static, and no
# pass reads either, so it cannot change a result. It is off by default, and
# without it a span is an empty type and the step pays nothing.
#
# `census-generated-tiles` is a test-only switch as well. It counts the tiles
# that the tile value field has generated on the calling thread. The build
# test then asserts that building a world generates none, and that a copy of
# the whole column generates one for each tile, so the same test proves that
# the counter counts.
[features]
probe-nondeterminism = []
# `probe-stale-destinations` is a test-only switch. It stops the step deriving
# the destination field after the controller, so the field describes the seed
# set as it stood before the controller sent anything. The probe test then
# asserts that the send test fails. A test with no proven failure mode is
# decoration.
probe-stale-destinations = []
# `probe-frozen-destinations` is a test-only switch. The send verb marks the
# destination field as changed, and the step derives the field only when
# something marked it. This switch removes the mark, so the field describes the
# seed set of the first frame for the whole run. The dependency tests then fail.
# A guard with no proven failure mode is decoration.
probe-frozen-destinations = []
census-generated-tiles = []
stage-cost = []
# `census-holding` counts what the holding apply does on each frame. It is a
# measurement switch and it compiles to nothing when it is off.
census-holding = []
# `probe-spawn-count` is a test-only switch. It counts the threads that the
# parallel fan-out creates, so a test can prove that a stage of one chunk
# creates none. It compiles to nothing when it is off.
probe-spawn-count = []

[dev-dependencies]
bytemuck.workspace = true
proptest.workspace = true

[lints]
workspace = true

# The benchmark measures the cost of a frame on the target platform. It is not
# a test, and no assertion in this project reads a clock. `test = false` keeps
# it out of `cargo test`, and `cargo bench --bench target_cost` runs it.
[[bench]]
name = "target_cost"
harness = false
test = false

[[bench]]
name = "exit_locality"
harness = false
test = false

[[bench]]
name = "masked_summary"
harness = false
test = false

[[bench]]
name = "faction_observation"
harness = false
test = false

[[bench]]
name = "legal_actions"
harness = false
test = false

# The benchmark measures one tick of the world the trainer builds, stage by
# stage. It is not a test, and no assertion in this project reads a clock.
[[bench]]
name = "training_tick"
harness = false
test = false

# The test reads the thread creation count of the parallel fan-out. The count
# is behind a feature, so the test needs that feature to hold anything.
[[test]]
name = "parallel_fan_out"
required-features = ["probe-spawn-count"]
