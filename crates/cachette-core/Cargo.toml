[package]
name = "cachette-core"
description = "The Cachette simulation core. This crate must never depend on PyO3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ADR-0041: this crate has no PyO3 dependency at all. The check in
# scripts/check-crate-split.sh fails if one appears in the tree.
[dependencies]
bytemuck.workspace = true

# `probe-nondeterminism` is a test-only switch. It makes every slot reduction
# read its slots in reverse index order, so any result that depends on slot
# order changes. That covers the event log join and every minimum, maximum
# and first-wins. The probe tests then assert that the determinism tests
# fail. A determinism test with no proven failure mode is decoration.
#
# `census-generated-tiles` is a test-only switch as well. It counts the tiles
# that the tile value field has generated on the calling thread. The build
# test then asserts that building a world generates none, and that a copy of
# the whole column generates one for each tile, so the same test proves that
# the counter counts.
[features]
probe-nondeterminism = []
census-generated-tiles = []

[dev-dependencies]
bytemuck.workspace = true
proptest.workspace = true

[lints]
workspace = true

# The benchmark measures the cost of a frame on the target platform. It is not
# a test, and no assertion in this project reads a clock. `test = false` keeps
# it out of `cargo test`, and `cargo bench --bench target_cost` runs it.
[[bench]]
name = "target_cost"
harness = false
test = false
