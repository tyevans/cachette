[package]
name = "cachette-py"
description = "The PyO3 bindings for the Cachette simulation core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

# ADR-0041: the bindings depend on the core. The core never depends on
# the bindings, and the core never depends on PyO3.
# The contributing guide: the array crate tracks the interpreter binding crate minor
# version exactly. Upgrade the pair in one change, never one alone.
[dependencies]
cachette-core = { path = "../cachette-core", version = "0.0.0" }
# `extension-module` is not enabled here. maturin adds it for the wheel
# build. Enabling it in this file would break the link of a plain test
# binary.
pyo3 = { workspace = true, features = ["abi3-py311"] }
numpy = "0.29.0"
# ADR-0094 D4: the render core carries no window library and no display
# connection. This crate takes the drawing without the demonstration window,
# so a wheel built from it runs on a machine that has no display.
cachette-view = { path = "../cachette-view", version = "0.0.0", default-features = false }

# A test-only switch. The batch fixes the order of its results by sorting on
# the index of the world. This feature removes that sort, so a build that
# carries it reports in the order the workers hold their worlds. It exists to
# prove that the order test can fail, and nothing else enables it.
# Testing Rules, section 1.
[features]
perturb-batch-report-order = []

[lints]
workspace = true
