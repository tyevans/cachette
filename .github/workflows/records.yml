name: records

on:
  push:
  pull_request:

# The two recipes below are the one declaration site of the document checks.
# This workflow listed them again and fell behind: it ran six of the eight
# checks the justfile ran, and nothing failed when the two lists disagreed.
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@v3
      - name: Check the records, the registers and the prose
        run: just records
      - name: Prove that each record check can fail
        run: just records-probe
