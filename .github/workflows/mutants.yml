name: mutants

# Mutation testing is slow. It is not a commit gate. It runs on a
# schedule, on a manual request, and on a pull request that carries the
# `mutants` label.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust mutants
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'mutants'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run the mutants
        run: cargo mutants --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out

