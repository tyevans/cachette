# The documentation site. ADR-0107 D1 and D4.
#
# The reference comes from an import of the compiled extension module, so this
# is a compile job. It builds the Rust bindings crate, installs the built
# module, and only then builds the site. It fails rather than publishes when
# the import does not happen.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler. The site build needs it,
      # because the reference needs the compiled module.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v3

      # The recipe builds the extension, installs it, builds the site, and
      # checks that every summary the import found reached a page. The order
      # and the checks are in the script, which is their one declaration site.
      - name: Build the site
        run: just docs

      # A guard nobody has seen fire has not been shown to exist. The recipe
      # takes the compiled module out of the environment, then turns module
      # inspection off, and requires the job above to fail both times. The
      # second case is the one that reports nothing on its own.
      - name: Prove that the build fails when the import fails
        run: just docs-probe

      # The artefact is built on every run. Publishing it is a separate job,
      # because a pull request must build the site and must not publish it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  # This job publishes the built site on every push to the main branch.
  #
  # It carries no switch of its own, and DEC-118 is why. The hosting source
  # setting of the repository is the switch, the deploy step reads it, and a
  # second switch in this file would be one fact in two places with nothing
  # that fails when the copies disagree. A repository variable also makes a
  # job that publishes nothing look the same as a job that is turned off.
  #
  # This job fails while the repository publishes its site from a branch
  # rather than from a workflow. The failure names the setting, and only the
  # project owner can change it.
  publish:
    name: publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
