name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The fast gate. It runs on every push and on every pull request.
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler and the primary target of
      # ADR-0008.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ADR-0002 D2: clippy rejects a named float type. It does not reject
      # a float literal whose type the compiler infers. This script does.
      - name: Check the float ban
        run: ./scripts/check-float-ban.sh

      # ADR-0041: the core crate must never link the interpreter.
      - name: Check the crate split
        run: ./scripts/check-crate-split.sh

      # This covers the unit tests, the property tests, and the two
      # determinism tests of ADR-0001 D4.
      - name: Test
        run: cargo test --workspace

      # A determinism test that compares a run against itself always passes
      # and proves nothing. The probe feature perturbs the join order. The
      # thread-count test must then fail, and the probe test must pass.
      - name: Prove that the determinism tests can fail
        run: |
          ! cargo test --package cachette-core \
              --features probe-nondeterminism --test thread_equivalence
          cargo test --package cachette-core \
              --features probe-nondeterminism --test determinism_probe

      # The runners are x86-64. The primary target is 64-bit ARM on Linux.
      # `cargo check` needs no linker for a foreign target, so it runs on
      # the x86-64 runner and catches a target-specific compile error.
      # A cross-compiled build and a test run on the target are deferred.
      # The viewer is excluded on purpose. It opens a window, so it links a C
      # library that needs a cross-compiler, and a window on a headless
      # server means nothing. The engine is what ships to the target.
      - name: Check the primary target
        run: cargo check --package cachette-core --package cachette-py --target aarch64-unknown-linux-gnu

  python:
    name: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The contributing guide sets the minimum interpreter version at 3.11.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the extension into the environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Check the formatting
        run: uv run ruff format --check python tests

      - name: Lint
        run: uv run ruff check python tests

      - name: Check the types
        run: uv run mypy

      # The tests import the installed package, never the source tree.
      - name: Test
        run: uv run pytest

  # ADR-0097 D4. Miri interprets the program and reports an aliasing defect, a
  # provenance defect, or a read of an uninitialised byte. No other job here
  # sees any of those. The state hash reads whole structures as raw bytes, and
  # an undeclared padding byte puts an uninitialised byte into that read. On a
  # development machine such a byte is reliably zero, so only Miri catches it.
  #
  # This job runs beside the others rather than inside the fast gate, because
  # Miri interprets every instruction and is slow. The test list is in the
  # justfile, which is the single declaration site for it.
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the dated nightly of ADR-0097 D2 and names
      # the miri and rust-src components that this job needs.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - uses: extractions/setup-just@v3

      - name: Check the unsafe code
        run: just miri

  audit:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The contributing guide requires that the wheel pipeline exists before the engine.
  # The matrix is one platform for now. The record names five. The rest are
  # deferred, together with the free-threaded job.
  wheel:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel and the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --sdist --out dist
          manylinux: auto

      # The wheel is the artefact almost every user installs, so it is the
      # one the smoke test must cover first.
      - name: Install from the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python scripts/smoke.py

      # The contributing guide: test the source distribution. It is the item that is
      # always skipped, and a broken one is invisible until a user finds it.
      - name: Install from the source distribution
        run: |
          python -m venv /tmp/sdist-venv
          # `--no-binary cachette` names this package only. `:all:` also
          # builds every dependency from source, which means building NumPy,
          # and that takes longer than the whole pipeline.
          /tmp/sdist-venv/bin/pip install --no-binary cachette dist/*.tar.gz
          # The smoke test is a file, not a snippet. A snippet here is a
          # second declaration site for the public interface, and nobody
          # greps a workflow when they rename an argument.
          /tmp/sdist-venv/bin/python scripts/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist
