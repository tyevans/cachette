[workspace]
resolver = "2"
members = ["crates/cachette-core", "crates/cachette-py", "crates/cachette-view"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tyevans/cachette"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
proptest = "1.11"
pyo3 = "0.29.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"

# The contributing guide: strip, keep line tables, enable LTO, never abort on panic.
[profile.release]
strip = "symbols"
debug = "line-tables-only"
lto = true
panic = "unwind"
codegen-units = 1

# ADR-0083: the gate compiles the tests in this profile. The optimisation
# level is here because the engine steps a large world and an unoptimised
# build spends nearly all of the suite in code the optimiser removes. The
# overflow check is here because it is the net that catches an accumulator
# too narrow for the level it sums, and because raising the level next to it
# is the moment somebody would take it away. The test profile inherits both.
[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true
