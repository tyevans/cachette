[project]
name = "direct-die"
version = "0.1.0"
description = "Refine an SVG game asset against a living style guide, with a vision model"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.7",
]

[project.scripts]
direct-die = "direct_die.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["direct_die"]
